# Installed by common/11-k3s.sh into the k3s auto-deploy manifests directory.
# ArgoCD (on the ArgoCD machine) authenticates with the client certificate CN=argocd signed by this
# cluster's client-ca (wizard, lib/ca.sh) and manages the whole cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homelab-argocd
  labels:
    app.kubernetes.io/managed-by: homelab
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: argocd
