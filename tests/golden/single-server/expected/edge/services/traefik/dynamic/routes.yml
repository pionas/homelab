# Generated by the wizard from state.yaml (routes). Panels are not routed here: VPN only.
http:
  routers:
    app_example_org:
      rule: "Host(`app.example.org`)"
      entryPoints: [websecure]
      service: app_example_org
      tls:
        certResolver: acme
  services:
    app_example_org:
      loadBalancer:
        healthCheck:
          path: /healthz
          interval: 10s
          timeout: 3s
        servers:
          - url: "http://10.100.10.100:80"
