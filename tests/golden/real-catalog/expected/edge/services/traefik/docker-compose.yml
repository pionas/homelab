# Traefik on the edge: the only service with public ports (80, 443), decision "public ports".
# Routes come from dynamic/ (file provider, generated by the wizard); certificates from step-ca (ACME).
services:
  traefik:
    image: traefik:v3.7.16
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Trust the homelab root CA when talking to step-ca (lego, Traefik's ACME client).
      LEGO_CA_CERTIFICATES: /etc/traefik/root_ca.crt
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "./traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./dynamic:/etc/traefik/dynamic:ro"
      - "./root_ca.crt:/etc/traefik/root_ca.crt:ro"
      - "./acme:/etc/traefik/acme"
