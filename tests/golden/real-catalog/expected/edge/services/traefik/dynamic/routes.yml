# Generated by the wizard from state.yaml (routes). Panels are not routed here: VPN only.
http:
  routers:
    e-konkursy_homelab_internal:
      rule: "Host(`e-konkursy.homelab.internal`)"
      entryPoints: [websecure]
      service: e-konkursy_homelab_internal
      tls:
        certResolver: acme
    pionas_dev:
      rule: "Host(`pionas.dev`)"
      entryPoints: [websecure]
      service: pionas_dev
      tls:
        certResolver: acme
  services:
    e-konkursy_homelab_internal:
      failover:
        service: e-konkursy_homelab_internal-main
        fallback: e-konkursy_homelab_internal-fallback
    e-konkursy_homelab_internal-main:
      loadBalancer:
        healthCheck:
          path: /healthz
          interval: 10s
          timeout: 3s
        servers:
          - url: "http://10.100.10.103:80"
    e-konkursy_homelab_internal-fallback:
      loadBalancer:
        healthCheck:
          path: /healthz
          interval: 10s
          timeout: 3s
        servers:
          - url: "http://10.100.10.101:80"
    pionas_dev:
      loadBalancer:
        healthCheck:
          path: /healthz
          interval: 10s
          timeout: 3s
        servers:
          - url: "http://10.100.10.103:80"
