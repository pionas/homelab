# Traefik static configuration (edge). Generated by the wizard.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  acme:
    acme:
      email: "admin@homelab.internal"
      storage: /etc/traefik/acme/acme.json
      # VirtualBox stage: step-ca over WireGuard; production: the Let's Encrypt URL instead.
      caServer: "https://10.100.10.101:9000/acme/acme/directory"
      httpChallenge:
        entryPoint: web

api:
  dashboard: false

log:
  level: INFO
