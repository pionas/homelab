# Typesense (GPL-3.0, run unmodified): search API published only on the WireGuard address. The admin
# API key (ROOT) comes from typesense.env (mode 600), never the command line. The image runs as
# root by default; here it runs as an unprivileged user with a read-only root file system.
services:
  typesense:
    image: typesense/typesense:30.2
    restart: unless-stopped
    user: "10000:10000"
    env_file: ./typesense.env
    environment:
      TYPESENSE_DATA_DIR: /data
    ports:
      - "10.100.10.102:8108:8108"
    volumes:
      - "/var/lib/homelab/data/typesense:/data"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
