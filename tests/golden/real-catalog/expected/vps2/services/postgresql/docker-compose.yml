# PostgreSQL, published only on the WireGuard address. Passwords come from postgresql.env (mode 600),
# never from this file. Data stays on the host when the container is removed.
services:
  postgresql:
    image: postgres:17.10
    restart: unless-stopped
    env_file: ./postgresql.env
    ports:
      - "10.100.10.102:5432:5432"
    volumes:
      - "/var/lib/homelab/data/postgresql:/var/lib/postgresql/data"
      - "./initdb:/docker-entrypoint-initdb.d:ro"
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
